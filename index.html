<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AscendCortex™ MEO + AEO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root{
      --bg:#0b0f14;
      --card:#101826;
      --text:#e8eef6;
      --muted:#a9b6c7;
      --line:rgba(255,255,255,.10);
      --accent:#6ee7ff;
      --accent2:#a78bfa;
      --good:#34d399;
      --warn:#fbbf24;
      --bad:#fb7185;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1000px 600px at 20% -10%, rgba(110,231,255,.14), transparent 60%),
        radial-gradient(900px 500px at 90% 0%, rgba(167,139,250,.12), transparent 55%),
        var(--bg);
      color:var(--text);
      line-height:1.45;
    }
    a{color:var(--accent); text-decoration:none}
    a:hover{text-decoration:underline}

    .wrap{max-width:980px; margin:0 auto; padding:32px 18px 70px}

    .topbar{
      display:flex; justify-content:space-between; align-items:center;
      padding-bottom:22px; margin-bottom:26px;
      border-bottom:1px solid var(--line);
    }
    .brand{font-weight:800}
    .pill{
      font-size:12px; color:var(--muted);
      border:1px solid var(--line);
      padding:6px 10px; border-radius:999px;
      background:rgba(255,255,255,.03);
    }

    h1{font-size:38px; margin-bottom:10px}
    h2{font-size:20px}
    p{color:var(--muted)}

    .btn{
      border:none; border-radius:14px;
      padding:12px 18px; font-weight:700;
      cursor:pointer;
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      color:#061018;
    }
    .ghost{
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--text);
      border-radius:14px;
      padding:12px 18px;
      cursor:pointer;
    }

    .card{
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border-radius:18px;
      padding:18px;
      margin-top:16px;
    }

    label{display:block; margin-top:14px; font-weight:600}
    input, select{
      width:100%; padding:12px;
      margin-top:6px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.02);
      color:var(--text);
    }

    .result{
      margin-top:18px;
      padding:16px;
      border-radius:16px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
    }

    .score{font-size:28px; font-weight:800}
    .good{color:var(--good)}
    .warn{color:var(--warn)}
    .bad{color:var(--bad)}

    /* Modal */
    .modal{
      position:fixed; inset:0;
      background:rgba(0,0,0,.7);
      display:none; align-items:center; justify-content:center;
      z-index:999;
    }
    .modalContent{
      background:#0f1624;
      border-radius:16px;
      padding:16px;
      max-width:720px;
      width:90%;
    }
    iframe{width:100%; height:380px; border-radius:12px}
  </style>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">AscendCortex™ <span class="pill">MEO + AEO</span></div>
    <div class="pill">Central Coast + Bay Area</div>
  </div>

  <h1>Get Found on Maps — and in AI Answers</h1>
  <p>
    AscendCortex™ combines <strong>Map Engine Optimization (MEO)</strong> and
    <strong>Answer Engine Optimization (AEO)</strong> so customers — and AI —
    choose your business first.
  </p>

  <button class="ghost" onclick="openHelp()">How This Works ▶</button>

  <div class="card">
    <h2>Instant Mini Visibility Audit</h2>

    <form id="auditForm">
      <label>Business Name</label>
      <input id="name" required>

      <label>Business Type</label>
      <select id="type">
        <option>Day Spa / Wellness</option>
        <option>Salon / Personal Care</option>
        <option>Restaurant / Hospitality</option>
        <option>Real Estate / Property Services</option>
        <option>Local Service Business</option>
      </select>

      <label>Main Goal</label>
      <select id="goal">
        <option>More calls</option>
        <option>More bookings</option>
        <option>More visibility</option>
      </select>

      <div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn" type="submit">Run Mini Audit</button>
        <a class="ghost" href="mailto:jdtmg1@gmail.com?subject=AscendCortex Full Audit Request">
          Request Full Audit
        </a>
      </div>
    </form>

    <div id="output"></div>
  </div>

</div>

<!-- Help Modal -->
<div class="modal" id="helpModal" onclick="closeHelp()">
  <div class="modalContent" onclick="event.stopPropagation()">
    <iframe
      src="https://www.youtube.com/embed/9cNAXaXRueg"
      title="AscendCortex Explainer"
      allowfullscreen>
    </iframe>
  </div>
</div>

<script>
document.getElementById("auditForm").addEventListener("submit", e => {
  e.preventDefault();

  const score = Math.floor(Math.random()*21)+60;
  let cls = score >= 80 ? "good" : score >= 65 ? "warn" : "bad";
  let label = score >= 80 ? "Strong" : score >= 65 ? "Average" : "Weak";

  document.getElementById("output").innerHTML = `
    <div class="result">
      <div class="score ${cls}">${score}/100</div>
      <p><strong>Status:</strong> ${label} visibility</p>
      <ul>
        <li>MEO: Map categories, reviews, and photos need alignment</li>
        <li>AEO: Business not structured for AI answers</li>
        <li>Competitors likely outranking in local + AI results</li>
      </ul>
      <p><strong>Next step:</strong> Full AscendCortex optimization</p>
    </div>
  `;
});

function openHelp(){
  document.getElementById("helpModal").style.display="flex";
}
function closeHelp(){
  document.getElementById("helpModal").style.display="none";
}
</script>

</body>
</html>
